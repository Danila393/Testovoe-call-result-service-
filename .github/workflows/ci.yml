name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: make lint typecheck

  test-linux:
    name: Tests · Linux · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    services:
      mongodb:
        image: mongo:7.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:4.1-management-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s --health-timeout 10s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      # Integration and e2e tests run against the service containers: none may be skipped here.
      - name: Tests (no skips allowed)
        run: |
          python -m pytest -rs -p no:cacheprovider | tee pytest.log
          if grep -qi "skipped" pytest.log; then echo "::error::tests were skipped"; exit 1; fi

  test-windows:
    name: Tests · Windows · Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      # Windows PowerShell 5.1: the task runner must work on the stock shell too.
      - name: tasks.ps1 on Windows PowerShell 5.1
        shell: powershell
        run: .\tasks.ps1 help
      - name: Install (PowerShell 7)
        shell: pwsh
        run: .\tasks.ps1 install
      # GitHub's Windows runners cannot run Linux service containers, so integration tests
      # skip themselves here (with the reason); unit tests, lint and types run in full.
      - name: Check (PowerShell 7)
        shell: pwsh
        run: .\tasks.ps1 check
      - name: Producer reports an unreachable broker cleanly
        shell: pwsh
        run: |
          $env:RABBITMQ_URL = 'amqp://guest:guest@127.0.0.1:1/'
          python producer.py
          if ($LASTEXITCODE -ne 1) { throw "expected exit code 1, got $LASTEXITCODE" }
          exit 0

  docker-e2e:
    name: docker compose up + reviewer scenario
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-producer.txt
      - name: Start the stack (waits for healthchecks)
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Reviewer scenario
        run: python scripts/smoke_check.py
      - name: Container status and logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
