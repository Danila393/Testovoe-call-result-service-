[project]
name = "call-results-service"
version = "1.0.0"
description = "Ingests call results from RabbitMQ into MongoDB and serves them over REST"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pymongo>=4.10,<5",
    "aio-pika>=9.4,<11",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "ASYNC", "S", "PT", "RUF", "ANN", "BLE"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Cyrillic text in strings/comments is intentional

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "SLF001"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["app", "producer.py", "scripts", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: requires running MongoDB and RabbitMQ"]
filterwarnings = ["error::DeprecationWarning:app.*"]
