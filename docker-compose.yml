name: call-results

services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    restart: unless-stopped
    ports:
      - "5672:5672"     # AMQP: producer.py on the host connects here
      - "15672:15672"   # management UI, guest/guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  app:
    build: .
    image: call-results-service:local
    restart: unless-stopped
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DB: call_results
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Optional: `docker compose run --rm producer` publishes the demo messages without
  # installing anything on the host. Not started by `docker compose up`.
  producer:
    build: .
    image: call-results-service:local
    profiles: ["tools"]
    command: ["python", "producer.py"]
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  mongo-data:
  rabbitmq-data:
